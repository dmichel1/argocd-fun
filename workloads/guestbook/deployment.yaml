apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - name: guestbook-ui
        image: gcr.io/google-samples/gb-frontend:v5   # same image the upstream guestbook uses today
        ports:
        - containerPort: 80
        readinessProbe:          # Argo CD health follows readiness, so a broken image holds the wave
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
